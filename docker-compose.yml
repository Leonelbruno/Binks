services:
  db:
    image: postgres:17-alpine
    container_name: binks-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-binks}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-binks}
      POSTGRES_DB: ${DB_NAME:-binks}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - binks-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  binks-pgdata:
